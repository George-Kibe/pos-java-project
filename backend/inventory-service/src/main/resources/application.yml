spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:pos}
    username: ${INVENTORY_DB_USER:inventory_user}
    password: ${INVENTORY_DB_PASSWORD}
    hikari:
      # hibernate.default_schema covers JPA only; the outbox and idempotency ledger use plain JDBC.
      schema: ${DB_SCHEMA:inventory}
      maximum-pool-size: 12
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: inventory
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    schemas: inventory
    default-schema: inventory
    locations: classpath:db/migration,classpath:db/migration/shared

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:inventory-service}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 20
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record
      # Matches the topic partition count, so each partition has a thread without idle consumers.
      concurrency: 3

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8083}
  error:
    whitelabel:
      enabled: false

pos:
  security:
    public-paths:
      - /actuator/health
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html

  inventory:
    # Expiry dates are the shops' dates, so "today" is taken in their time zone.
    shop-time-zone: ${SHOP_TIME_ZONE:Africa/Nairobi}
    # Far enough ahead that stock can be marked down or moved rather than written off.
    expiry-warning-days: ${EXPIRY_WARNING_DAYS:14}
    expiry-scan-cron: ${EXPIRY_SCAN_CRON:0 0 6 * * *}
    reservation-sweep: ${RESERVATION_SWEEP:PT5M}
    reconciliation-cron: ${RECONCILIATION_CRON:0 30 2 * * *}
    # Each branch's stock at cost, announced nightly for reporting.
    valuation-cron: ${VALUATION_CRON:0 15 3 * * *}
    valuation-page-size: ${VALUATION_PAGE_SIZE:500}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    com.pos: INFO
