spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:pos}
    username: ${AUTH_DB_USER:auth_user}
    password: ${AUTH_DB_PASSWORD}
    hikari:
      # Sets search_path on every connection. hibernate.default_schema only covers JPA; the
      # outbox is written with plain JDBC, which would otherwise look for `outbox` in the
      # default schema and fail. Set here so both paths agree.
      schema: ${DB_SCHEMA:auth}
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

  jpa:
    # Off deliberately: leaving the session open for view rendering hides N+1 queries behind lazy
    # loads that fire during serialisation, far from the code that caused them.
    open-in-view: false
    hibernate:
      # The schema belongs to Flyway. `validate` turns a mismatch between entity and table into a
      # startup failure rather than a runtime surprise on the first query that touches it.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    schemas: auth
    default-schema: auth
    # Service migrations start at V1; shared infrastructure occupies V0_*.
    locations: classpath:db/migration,classpath:db/migration/shared

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # All in-sync replicas must acknowledge: an event describing a committed state change must
      # not be lost to a broker failover.
      acks: all
      properties:
        enable.idempotence: true

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8081}
  error:
    whitelabel:
      enabled: false
  forward-headers-strategy: framework

pos:
  security:
    public-paths:
      - /actuator/health
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /api/v1/auth/register
      - /api/v1/auth/verify-otp
      - /api/v1/auth/resend-otp
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /api/v1/auth/logout
      - /api/v1/auth/forgot-password
      - /api/v1/auth/reset-password
      - /api/v1/device-enrolments
      - /.well-known/jwks.json
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html

  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}
    keystore:
      path: ${JWT_KEYSTORE_PATH:}
      password: ${JWT_KEYSTORE_PASSWORD:}
      active-alias: ${JWT_KEYSTORE_ACTIVE_ALIAS:}

  auth:
    # Empty: a self-registered account can do nothing until an administrator assigns a role.
    default-role: ${AUTH_DEFAULT_ROLE:}
    otp:
      length: ${OTP_LENGTH:6}
      ttl: ${OTP_TTL:PT10M}
      max-attempts: ${OTP_MAX_ATTEMPTS:5}
      resend-cooldown: ${OTP_RESEND_COOLDOWN:PT60S}
    lockout:
      max-failures: 5
      window: PT15M
      base-duration: PT1M
      max-duration: PT1H
    password-reset:
      ttl: PT30M
    # Supervisor PINs at the lane. An approval token allows one permission at one branch.
    # cash:intraday covers every movement between a till and the branch's intraday cash: deposits,
    # replenishments and the closing handover.
    # Sign-in only from registered tills and computers: on in production (docker-compose.prod.yml).
    # The administrator is exempt, so the first device can be registered and a lost one replaced.
    devices:
      required: ${DEVICE_REGISTRATION_REQUIRED:false}
      exempt-roles: SUPER_ADMIN
      enrolment-ttl: PT30M
    approval:
      ttl: PT2M
      max-failures: 5
      lock-duration: PT15M
      permissions: price:override,sale:void,sale:refund,cash:intraday
    bootstrap:
      enabled: ${AUTH_BOOTSTRAP_ENABLED:true}
      email: ${AUTH_BOOTSTRAP_EMAIL:}
      password: ${AUTH_BOOTSTRAP_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    com.pos: INFO
