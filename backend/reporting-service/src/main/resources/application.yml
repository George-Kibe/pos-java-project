spring:
  application:
    name: reporting-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:pos}
    username: ${REPORTING_DB_USER:reporting_user}
    password: ${REPORTING_DB_PASSWORD}
    hikari:
      # hibernate.default_schema covers JPA only; the outbox and idempotency ledger use plain JDBC.
      schema: ${DB_SCHEMA:reporting}
      maximum-pool-size: 12
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: reporting
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    schemas: reporting
    default-schema: reporting
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:reporting-service}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 20
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record
      # Matches the topic partition count, so each partition has a thread without idle consumers.
      concurrency: 3

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8089}
  error:
    whitelabel:
      enabled: false

pos:
  security:
    public-paths:
      - /actuator/health
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html

  reporting:
    # How often consumer lag is measured for /lag and the gauge; not per request.
    lag-interval: ${REPORTING_LAG_INTERVAL:PT30S}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    com.pos: INFO
