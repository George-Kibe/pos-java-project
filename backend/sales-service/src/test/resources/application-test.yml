# Test overlay merged onto the real application.yml by @ActiveProfiles("test").
# Never name this application.yml in src/test/resources: it shadows the main file instead of
# merging, silently dropping the Flyway, Kafka and schema configuration.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    consumer:
      group-id: sales-test
      auto-offset-reset: earliest

pos:
  outbox:
    # Outbox rows are read straight from the table; nothing here needs them on the broker.
    enabled: false
  sales:
    # The sweeper is invoked directly, so a test never waits on a clock.
    payment-sweep-cron: "0 0 5 31 2 *"
    return-window-days: 30

logging:
  level:
    org.testcontainers: WARN
    com.pos: INFO
