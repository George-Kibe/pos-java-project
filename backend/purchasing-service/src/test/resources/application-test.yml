# Test overlay merged onto the real application.yml by @ActiveProfiles("test").
# Never name this application.yml in src/test/resources: it shadows the main file instead of
# merging, silently dropping the Flyway, Kafka and schema configuration.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    consumer:
      group-id: purchasing-test
      auto-offset-reset: earliest

pos:
  outbox:
    # Outbox rows are read straight from the table; the relay is driven explicitly where needed.
    enabled: false
  purchasing:
    # Fixed so a tolerance assertion does not change meaning when the default is retuned.
    match-tolerance-amount: 10.00
    match-tolerance-percentage: 0.02

logging:
  level:
    org.testcontainers: WARN
    com.pos: INFO
