# Test overlay merged onto the real application.yml by @ActiveProfiles("test").
# Never name this application.yml in src/test/resources: it shadows the main file instead of
# merging, silently dropping the Flyway and schema configuration.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:1
    # No broker here; PriceReviewIT starts one and turns its listener on.
    listener:
      auto-startup: false

pos:
  outbox:
    # Outbox rows are read straight from the table; no broker is involved in these tests.
    enabled: false

logging:
  level:
    org.testcontainers: WARN
    com.pos: INFO
