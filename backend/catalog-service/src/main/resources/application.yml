spring:
  application:
    name: catalog-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:pos}
    username: ${CATALOG_DB_USER:catalog_user}
    password: ${CATALOG_DB_PASSWORD}
    hikari:
      # hibernate.default_schema covers JPA only; the outbox is written with plain JDBC.
      schema: ${DB_SCHEMA:catalog}
      maximum-pool-size: 12
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: catalog
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    schemas: catalog
    default-schema: catalog
    locations: classpath:db/migration,classpath:db/migration/shared

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8082}
  error:
    whitelabel:
      enabled: false

pos:
  security:
    public-paths:
      - /actuator/health
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    com.pos: INFO
