<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${brandName}">POS</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f4f5f7;font-family:Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7;padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                 style="max-width:600px;width:100%;background-color:#ffffff;border-radius:8px;padding:32px;">
            <tr>
              <!-- Attached to the message and referenced by Content-ID, so it shows without the
                   client fetching anything; see SmtpEmailSender. -->
              <td style="padding-bottom:12px;">
                <img src="cid:brand-logo" width="48" height="48" alt="" style="display:block;border:0;" />
              </td>
            </tr>
            <tr>
              <td style="font-size:20px;font-weight:bold;color:#111827;padding-bottom:8px;"
                  th:text="${brandName}">Realhive Group of Supermarkets</td>
            </tr>
            <tr>
              <td style="font-size:16px;color:#374151;padding-bottom:16px;">
                Hello <span th:text="${recipientName}">there</span>,
              </td>
            </tr>
            <tr>
              <td style="font-size:16px;color:#374151;padding-bottom:24px;">
                Use this code to verify your email address:
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom:24px;">
                <!-- Spaced and large: this is read off a screen and typed into another device. -->
                <div style="display:inline-block;font-size:32px;letter-spacing:8px;font-weight:bold;
                            color:#111827;background-color:#f3f4f6;border-radius:6px;padding:16px 24px;"
                     th:text="${otpCode}">123456</div>
              </td>
            </tr>
            <tr>
              <td style="font-size:14px;color:#6b7280;padding-bottom:8px;">
                It expires in <span th:text="${expiresInMinutes}">10</span> minutes and can be used once.
              </td>
            </tr>
            <tr>
              <td style="font-size:14px;color:#6b7280;padding-bottom:24px;">
                If you did not request this, you can ignore this email - nobody can use the code
                without it.
              </td>
            </tr>
            <tr>
              <td style="font-size:12px;color:#9ca3af;border-top:1px solid #e5e7eb;padding-top:16px;">
                Questions? <a th:href="'mailto:' + ${supportEmail}" th:text="${supportEmail}"
                              style="color:#6b7280;">support@example.com</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
