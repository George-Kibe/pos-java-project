# Test overlay merged onto the real application.yml by @ActiveProfiles("test").
# Never name this application.yml in src/test/resources: it shadows the main file instead of
# merging, silently dropping the Kafka, Flyway and notification configuration.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    consumer:
      # A fresh group per run, so a test never inherits committed offsets from a previous one.
      group-id: notification-test
      auto-offset-reset: earliest
  mail:
    host: 127.0.0.1
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 2000
          timeout: 2000
          writetimeout: 2000

pos:
  notification:
    brand-name: Test Supermarket
    support-email: help@test.local
    app-base-url: http://localhost:3000
    mail-from: Test Supermarket <no-reply@test.local>
    template-preview-enabled: true

logging:
  level:
    org.testcontainers: WARN
    com.icegreen: WARN
    com.pos: INFO
