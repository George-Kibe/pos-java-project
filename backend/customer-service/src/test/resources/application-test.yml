# Test overlay merged onto the real application.yml by @ActiveProfiles("test").
# Never name this application.yml in src/test/resources: it shadows the main file.
spring:
  kafka:
    consumer:
      group-id: customer-test
      auto-offset-reset: earliest

pos:
  outbox:
    # Outbox rows are read straight from the table.
    enabled: false
  loyalty:
    # The sweeps are driven by the tests, so nothing moves behind an assertion.
    expiry-cron: "0 0 5 31 2 *"
    tier-cron: "0 0 5 31 2 *"

logging:
  level:
    org.testcontainers: WARN
    com.pos: INFO
