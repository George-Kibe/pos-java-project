# Traefik's static configuration: the production edge (docker-compose.prod.yml). The one door into
# the POS from outside - TLS, and the branch and head office allowlist - in front of the web app.
# The ACME email comes from the environment (TRAEFIK_CERTIFICATESRESOLVERS_LE_ACME_EMAIL).

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    # No forwardedHeaders.trustedIPs: nothing in front of Traefik is trusted, so a client's own
    # X-Forwarded-For is discarded and replaced with the address the connection came from. The
    # gateway reads that address, so this is what keeps it honest.

certificatesResolvers:
  le:
    acme:
      storage: /letsencrypt/acme.json
      tlsChallenge: {}

providers:
  # Routes from a file rather than Docker labels: Traefik never needs the Docker socket.
  file:
    filename: /etc/traefik/dynamic.yml

ping: {}

log:
  level: INFO
accessLog: {}
