# Application services. Layered on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.services.yml up
#
# Only the gateway publishes a port. Every service is reachable on the internal network by name
# and from outside only through the gateway - which is what makes the gateway's authentication,
# rate limiting and token-version checks unavoidable rather than merely customary.
name: pos

services:
  auth-service:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/service.Dockerfile
      args:
        MODULE: auth-service
    image: pos/auth-service:dev
    container_name: pos-auth-service
    restart: unless-stopped
    networks: [pos]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pos}
      AUTH_DB_USER: ${AUTH_DB_USER:-auth_user}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      JWT_ISSUER: ${JWT_ISSUER:-http://auth-service:8081}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT15M}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P7D}
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL:-}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-}
    # Deliberately no `ports:` mapping. Reachable only as auth-service:8081 on the pos network.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api-gateway:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/service.Dockerfile
      args:
        MODULE: api-gateway
    image: pos/api-gateway:dev
    container_name: pos-api-gateway
    restart: unless-stopped
    networks: [pos]
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      AUTH_SERVICE_URI: http://auth-service:8081
      AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-http://auth-service:8081}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      # The only door into the system.
      - "${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
