# Application services. Layered on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.services.yml up
#
# Only the gateway publishes a port. Every service is reachable on the internal network by name
# and from outside only through the gateway - which is what makes the gateway's authentication,
# rate limiting and token-version checks unavoidable rather than merely customary.
name: pos

services:
  auth-service:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/service.Dockerfile
      args:
        MODULE: auth-service
    image: pos/auth-service:dev
    container_name: pos-auth-service
    restart: unless-stopped
    networks: [pos]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pos}
      AUTH_DB_USER: ${AUTH_DB_USER:-auth_user}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      JWT_ISSUER: ${JWT_ISSUER:-http://auth-service:8081}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT15M}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P7D}
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL:-}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-}
    # Deliberately no `ports:` mapping. Reachable only as auth-service:8081 on the pos network.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  catalog-service:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/service.Dockerfile
      args:
        MODULE: catalog-service
    image: pos/catalog-service:dev
    container_name: pos-catalog-service
    restart: unless-stopped
    networks: [pos]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pos}
      CATALOG_DB_USER: ${CATALOG_DB_USER:-catalog_user}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
    # No published port: reachable only through the gateway.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8082/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  inventory-service:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/service.Dockerfile
      args:
        MODULE: inventory-service
    image: pos/inventory-service:dev
    container_name: pos-inventory-service
    restart: unless-stopped
    networks: [pos]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pos}
      INVENTORY_DB_USER: ${INVENTORY_DB_USER:-inventory_user}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
    # No published port: reachable only through the gateway.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8083/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  purchasing-service:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/service.Dockerfile
      args:
        MODULE: purchasing-service
    image: pos/purchasing-service:dev
    container_name: pos-purchasing-service
    restart: unless-stopped
    networks: [pos]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: 8084
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pos}
      PURCHASING_DB_USER: ${PURCHASING_DB_USER:-purchasing_user}
      PURCHASING_DB_PASSWORD: ${PURCHASING_DB_PASSWORD:?required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
    # No published port: reachable only through the gateway.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8084/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  notification-service:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/service.Dockerfile
      args:
        MODULE: notification-service
    image: pos/notification-service:dev
    container_name: pos-notification-service
    restart: unless-stopped
    networks: [pos]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      SERVER_PORT: 8088
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pos}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER:-notification_user}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      # Mailpit in development: it accepts everything and shows it in a browser, so no real mail
      # ever leaves the machine. Production points these at Gmail or Workspace - same code path.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-Supermarket POS <no-reply@example.com>}
      BRAND_NAME: ${BRAND_NAME:-Supermarket POS}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@example.com}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    # No published port: reachable only through the gateway.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8088/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api-gateway:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/service.Dockerfile
      args:
        MODULE: api-gateway
    image: pos/api-gateway:dev
    container_name: pos-api-gateway
    restart: unless-stopped
    networks: [pos]
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      AUTH_SERVICE_URI: http://auth-service:8081
      NOTIFICATION_SERVICE_URI: http://notification-service:8088
      CATALOG_SERVICE_URI: http://catalog-service:8082
      INVENTORY_SERVICE_URI: http://inventory-service:8083
      PURCHASING_SERVICE_URI: http://purchasing-service:8084
      AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-http://auth-service:8081}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      # The only door into the system.
      - "${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
