# Production overlay: `make prod-up`, on top of docker-compose.yml and docker-compose.services.yml.
#
# Traefik is the only door. Staff reach the POS from a branch or head office network only
# (ALLOWED_CLIENT_NETWORKS, enforced at the edge and again by the gateway), and nothing else is
# published: the web app and the gateway are reachable on the private network alone.

services:
  traefik:
    image: traefik:v3.7.13
    container_name: pos-traefik
    restart: unless-stopped
    networks: [pos]
    ports:
      - "80:80"
      - "443:443"
    command: ["--configFile=/etc/traefik/traefik.yml"]
    environment:
      POS_DOMAIN: ${POS_DOMAIN:?POS_DOMAIN is required in production - the address staff open}
      ALLOWED_CLIENT_NETWORKS: ${ALLOWED_CLIENT_NETWORKS:?ALLOWED_CLIENT_NETWORKS is required in production - the branch and head office router addresses}
      TRAEFIK_CERTIFICATESRESOLVERS_LE_ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required in production - for the TLS certificate}
    volumes:
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik_certificates:/letsencrypt
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      web:
        condition: service_healthy

  web:
    ports: !reset []

  api-gateway:
    ports: !reset []
    environment:
      ALLOWED_CLIENT_NETWORKS: ${ALLOWED_CLIENT_NETWORKS:?ALLOWED_CLIENT_NETWORKS is required in production}

volumes:
  traefik_certificates:
    name: pos-traefik-certificates
