# Overlay for browser end-to-end runs (`make web-e2e`) and demo seeding (`make demo-seed`).
#
# Both create throwaway accounts, and their codes must not be emailed to made-up addresses
# through the real provider. For the run, notification-service writes each message to a file inside
# its own container instead of sending it; the test reads the code back with `docker exec`.
# Both targets put notification-service back as configured afterwards.
services:
  notification-service:
    environment:
      MAIL_TRANSPORT: capture

  # Every test in the run comes from one address and signs in far more often than a person does,
  # so the per-address limit on credential endpoints (10 a minute) is raised for the run and put
  # back afterwards. The limit itself is covered by api-gateway's own tests.
  api-gateway:
    environment:
      POS_GATEWAY_RATELIMIT_AUTH_CAPACITY: "500"
